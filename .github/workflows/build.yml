name: Build Desktop and Android Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. بناء نسخة سطح المكتب للويندوز (Windows EXE)
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Package Windows App (Electron)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Logosteria-Windows-Desktop
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap

  # 2. بناء تطبيق الأندرويد القابل للتثبيت (Android Debug APK) باستخدام Capacitor
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Logosteria-Android-App
          path: |
            android/app/build/outputs/apk/debug/*.apk
