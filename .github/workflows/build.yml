name: Build Desktop and Android Apps

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      # --- 1. بناء نسخة سطح المكتب (Windows EXE) ---
      - name: Package Windows App (Electron)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Logosteria-Windows-Desktop
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap

      # --- 2. بناء نسخة الأندرويد (Android APK) ---
      - name: Setup Java JDK for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        run: |
          # افترض أن مشروعك يستخدم Capacitor أو Cordova للبناء، أضف أمر البناء المناسب هنا
          # مثال لـ Capacitor: npx cap sync android && cd android && ./gradlew assembleRelease
          echo "Building Android APK..."

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Logosteria-Android-App
          path: |
            android/app/build/outputs/apk/release/*.apk
            dist-electron/*.exe
            dist-electron/*.blockmap
